[project]
name = "pluto"
version = "0.1.0"
description = "Pluto: a local, AI-first portfolio manager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13",
    "platformdirs>=4",
]

[project.optional-dependencies]
chat = ["claude-agent-sdk>=0.2", "anthropic>=1.4"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "sse-starlette>=2"]

[project.scripts]
pluto = "pluto.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "freezegun>=1.5",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real network endpoints (opt-in with -m live)"]
addopts = "-m 'not live'"
